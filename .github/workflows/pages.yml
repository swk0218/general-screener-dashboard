name: Deploy GENERAL SCREENER

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
      artifact_id: ${{ steps.pages_upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate committed engine status and encrypted result binding
        run: node scripts/prepare-radar-status.mjs public/data/radar-observation.json public/data/market-radar.enc.json --retain-publication

      - name: Verify and build
        timeout-minutes: 10
        run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Pages artifact identity and bounded readiness
        run: python -m unittest discover -s tests -p test_pages_artifact.py

      - name: Stamp actual build completion (source and model times remain unchanged)
        run: python -c "import json,datetime,pathlib; p=pathlib.Path('dist/client/data/radar-observation.json'); d=json.loads(p.read_text()); d['built_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat(); p.write_text(json.dumps(d,indent=2))"

      - name: Name this build artifact uniquely across retries
        id: artifact_identity
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: dist/client

      - name: Wait for exact uploaded artifact visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.artifact_identity.outputs.name }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        # REST and deployment's artifact-service indexes can still differ; any
        # later deployment error remains fail-closed and retry names stay unique.
        run: &wait_pages_artifact |
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          def wait_for_artifact(fetch, now, sleep, *, name, artifact_id, run_id, head, timeout=120):
              deadline = now() + timeout
              stable = 0
              while now() < deadline:
                  try:
                      response = fetch(min(10, max(0.1, deadline - now())))
                  except urllib.error.HTTPError as error:
                      limited = error.code == 403 and (error.headers.get('X-RateLimit-Remaining') == '0' or error.headers.get('Retry-After') is not None)
                      if error.code not in (429, 500, 502, 503, 504) and not limited:
                          raise RuntimeError('PAGES_ARTIFACT_HTTP_REJECTED') from None
                      stable = 0
                      delay = 5
                      retry_after = error.headers.get('Retry-After', '')
                      if retry_after.isdigit():
                          delay = max(delay, min(120, int(retry_after)))
                      sleep(min(delay, max(0, deadline - now())))
                      continue
                  if now() >= deadline:
                      raise TimeoutError('PAGES_ARTIFACT_NOT_READY')
                  if not isinstance(response, dict) or not isinstance(response.get('artifacts'), list) or any(not isinstance(a, dict) for a in response['artifacts']):
                      raise ValueError('PAGES_ARTIFACT_RESPONSE_INVALID')
                  if type(response.get('total_count')) is not int or response['total_count'] > 100 or response['total_count'] != len(response['artifacts']):
                      raise ValueError('PAGES_ARTIFACT_LIST_INCOMPLETE')
                  matches = [a for a in response['artifacts'] if a.get('name') == name]
                  if len(matches) > 1:
                      raise ValueError('PAGES_ARTIFACT_NAME_AMBIGUOUS')
                  if matches:
                      artifact = matches[0]
                      identity = artifact.get('workflow_run') or {}
                      if (type(artifact.get('id')) is not int or artifact['id'] != artifact_id
                              or artifact.get('expired') is not False
                              or type(artifact.get('size_in_bytes')) is not int
                              or artifact['size_in_bytes'] <= 0
                              or type(identity.get('id')) is not int or identity['id'] != run_id
                              or identity.get('head_sha') != head):
                          raise ValueError('PAGES_ARTIFACT_IDENTITY_MISMATCH')
                      stable += 1
                      if stable == 2:
                          return
                  else:
                      stable = 0
                  sleep(min(5, max(0, deadline - now())))
              raise TimeoutError('PAGES_ARTIFACT_NOT_READY')

          def artifact_fetcher(repository, run_id, token, opener=urllib.request.urlopen):
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
                  raise ValueError('PAGES_REPOSITORY_INVALID')
              if not token or token.strip() != token or '\n' in token or '\r' in token:
                  raise ValueError('PAGES_TOKEN_REQUIRED')
              url = f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100'
              def fetch(timeout):
                  request = urllib.request.Request(url, headers={'User-Agent': 'Pages-artifact-readiness/1.0', 'Accept': 'application/vnd.github+json', 'Authorization': f'Bearer {token}'})
                  with opener(request, timeout=timeout) as response:
                      return json.load(response)
              return fetch

          if __name__ == '__main__':
              repository = os.environ['GITHUB_REPOSITORY']
              run_id = int(os.environ['GITHUB_RUN_ID'])
              fetch = artifact_fetcher(repository, run_id, os.environ.get('GITHUB_TOKEN', ''))
              wait_for_artifact(fetch, time.monotonic, time.sleep,
                  name=os.environ['EXPECTED_ARTIFACT_NAME'], artifact_id=int(os.environ['EXPECTED_ARTIFACT_ID']),
                  run_id=run_id, head=os.environ['GITHUB_SHA'])
              print('Exact Pages artifact visible in two separate REST observations')
          PY

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      # Existing CSP remains self-only. Browser never contacts GitHub API.
      # Stamp the actual first successful publication of this observation data,
      # then publish that same data plus receipt. No new token permission.
  verify-publication:
    # Environment success is written after the first deployment job completes.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: publication-input

      - name: Attach verified first-publication receipt to same-origin status
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,tarfile,urllib.request
          target=pathlib.Path('publication-site');target.mkdir()
          with tarfile.open('publication-input/artifact.tar') as archive:
              archive.extractall(target,filter='data')
          path=target/'data/radar-observation.json'
          status=json.loads(path.read_text())
          import hashlib
          feed=target/'data/market-radar.enc.json'
          if status.get('feed_cipher_sha256'):
              if not feed.is_file() or hashlib.sha256(feed.read_bytes()).hexdigest()!=status['feed_cipher_sha256']:
                  raise SystemExit('Engine status/feed identity mismatch')
          root='https://api.github.com/repos/swk0218/general-screener-dashboard'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MarketRadar-publication-receipt/1.0'}),timeout=15) as response:
                  return json.load(response)
          if not status['published_at_utc']:
              for deployment in get(root+'/deployments?environment=github-pages&per_page=5'):
                  if deployment['sha']!=os.environ['BUILD_SHA']:continue
                  for receipt in get(root+'/deployments/'+str(deployment['id'])+'/statuses'):
                      if receipt['state']=='success' and datetime.datetime.fromisoformat(receipt['created_at'].replace('Z','+00:00'))>=datetime.datetime.fromisoformat(status['built_at_utc']):
                          status['published_at_utc']=receipt['created_at']
                          status['publication_deployment_id']=deployment['id']
                          status['publication_receipt_result_id']=status.get('engine_result_id')
                          break
                  if status['published_at_utc']:break
          if not status['published_at_utc']:raise SystemExit('Verified publication receipt unavailable; existing deployed NO_SIGNAL remains safe')
          path.write_text(json.dumps(status,indent=2))
          print('Verified first publication '+status['published_at_utc'])
          PY

      - id: verified_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-site

      - name: Wait for exact verified artifact visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: github-pages-verified-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.verified_upload.outputs.artifact_id }}
        run: *wait_pages_artifact

      - name: Publish same observation with verified first-publication time
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages-verified-${{ github.run_id }}-${{ github.run_attempt }}

