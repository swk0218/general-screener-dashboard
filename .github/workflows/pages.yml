name: Deploy GENERAL SCREENER

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # US session next calendar day 19:00 KST; no inference/alert activation.
    - cron: '0 10 * * 2-6'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derived-only daily observation status
        run: |
          python -m pip install exchange-calendars==4.13.2 pandas==2.2.3
          python scripts/radar-observation-status.py --output public/data/radar-observation.json --previous-url https://swk0218.github.io/general-screener-dashboard/data/radar-observation.json

      - name: Verify and build
        run: npm run check

      - name: Stamp actual build completion (publication remains unknown until deployment)
        run: python -c "import json,datetime,pathlib; p=pathlib.Path('dist/client/data/radar-observation.json'); d=json.loads(p.read_text()); d['built_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat(); p.write_text(json.dumps(d,indent=2))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
