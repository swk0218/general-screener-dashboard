name: Deploy GENERAL SCREENER

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # US session next calendar day 19:00 KST; no inference/alert activation.
    - cron: '0 10 * * 2-6'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derived-only daily observation status
        run: |
          python -m pip install exchange-calendars==4.13.2 pandas==2.2.3
          python scripts/radar-observation-status.py --output public/data/radar-observation.json --previous-url https://swk0218.github.io/general-screener-dashboard/data/radar-observation.json
          python -c "import json,pathlib; p=pathlib.Path('public/data/radar-observation.json'); d=json.loads(p.read_text()); d['score_delivery_available']=pathlib.Path('public/data/market-radar.enc.json').is_file(); p.write_text(json.dumps(d,indent=2))"

      - name: Verify and build
        timeout-minutes: 10
        run: npm run check

      - name: Stamp actual build completion (publication remains unknown until deployment)
        run: python -c "import json,datetime,pathlib; p=pathlib.Path('dist/client/data/radar-observation.json'); d=json.loads(p.read_text()); d['built_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat(); p.write_text(json.dumps(d,indent=2))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Existing CSP remains self-only. Browser never contacts GitHub API.
      # Stamp the actual first successful publication of this observation data,
      # then publish that same data plus receipt. No new token permission.
  verify-publication:
    # Environment success is written after the first deployment job completes.
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: publication-input

      - name: Attach verified first-publication receipt to same-origin status
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,tarfile,urllib.request
          target=pathlib.Path('publication-site');target.mkdir()
          with tarfile.open('publication-input/artifact.tar') as archive:
              archive.extractall(target,filter='data')
          path=target/'data/radar-observation.json'
          status=json.loads(path.read_text())
          root='https://api.github.com/repos/swk0218/general-screener-dashboard'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MarketRadar-publication-receipt/1.0'}),timeout=15) as response:
                  return json.load(response)
          for deployment in get(root+'/deployments?environment=github-pages&per_page=5'):
              if deployment['sha']!=os.environ['BUILD_SHA']:continue
              for receipt in get(root+'/deployments/'+str(deployment['id'])+'/statuses'):
                  if receipt['state']=='success' and datetime.datetime.fromisoformat(receipt['created_at'].replace('Z','+00:00'))>=datetime.datetime.fromisoformat(status['computed_at_utc']):
                      status['published_at_utc']=receipt['created_at']
                      status['first_publication_deployment_id']=deployment['id']
                      break
              if status['published_at_utc']:break
          if not status['published_at_utc']:raise SystemExit('Verified publication receipt unavailable; existing deployed NO_SIGNAL remains safe')
          path.write_text(json.dumps(status,indent=2))
          print('Verified first publication '+status['published_at_utc'])
          PY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-verified
          path: publication-site

      - name: Publish same observation with verified first-publication time
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages-verified
