name: Frontend regression CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BRIEFING_TEST_PYTHON: python
      BRIEFING_TEST_BACKEND: ${{ github.workspace }}/.ci-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned offline briefing test backend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: swk0218/Screening-agent-by-FMP-API
          ref: 62570147c225942bf92d68aca00b53193d244cc0
          path: .ci-backend
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked offline test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r tests/requirements-briefing-linux.lock
      - name: Test Pages artifact identity and bounded readiness
        run: python -m unittest discover -s tests -p test_pages_artifact.py
      - run: npm ci --ignore-scripts
      - name: Prepare engine status using the Pages build step
        run: node scripts/prepare-radar-status.mjs public/data/radar-observation.json public/data/market-radar.enc.json --retain-publication
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve synthetic UI checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seasonality-synthetic-ui
          path: test-results/
          retention-days: 7
